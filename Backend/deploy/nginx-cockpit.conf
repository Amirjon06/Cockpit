# Cockpit backend — nginx reverse proxy for the FastAPI container (127.0.0.1:8100).
#
# Install on the server:
#   sudo cp nginx-cockpit.conf /etc/nginx/sites-available/cockpit
#   sudo ln -s /etc/nginx/sites-available/cockpit /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   # then TLS:  sudo certbot --nginx -d api.your-domain
#
# SSE note: the API streams text/event-stream, so proxy buffering is OFF and
# read timeouts are long — otherwise events get buffered/cut.

server {
    listen 80;
    server_name api.octopilothub.com;   # Cockpit backend API

    # Uploads can be large study materials.
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events: stream, don't buffer.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
